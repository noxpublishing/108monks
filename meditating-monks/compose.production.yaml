# Use with: docker compose -f compose.yaml -f compose.production.yaml up -d --build
# The app remains bound to loopback on the host; Caddy accesses it on the Compose network.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      monastery:
        condition: service_healthy
    environment:
      MM_DOMAIN: ${MM_DOMAIN:?Set MM_DOMAIN in .env to your real domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
volumes:
  caddy-data:
  caddy-config:
