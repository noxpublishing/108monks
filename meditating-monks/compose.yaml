services:
  monastery:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - monastery-data:/app/data
      - ./config:/app/config:ro
      - ./profiles:/app/profiles:ro
      - ./media:/app/media:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 15s
volumes:
  monastery-data:
