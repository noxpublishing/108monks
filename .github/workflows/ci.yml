name: Test
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: meditating-monks
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm test
      - run: python -m app.cli validate profiles/public-compassion.json
      - run: python -m app.cli validate profiles/longchen-nyingtik-outline.json
      - run: docker compose config -q
      - run: MM_DOMAIN=monastery.example docker compose -f compose.yaml -f compose.production.yaml config -q
      - run: docker compose up -d --build --wait --wait-timeout 60
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-results
          path: meditating-monks/test-results/
